<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf7ff">
<title>Baby Shower de Andrew Eithan</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px 40px;background:linear-gradient(180deg,#f4fbff,#e7f5ff);font-family:Arial,sans-serif;color:#24506d;text-align:center}
main{max-width:620px;margin:auto}.invite{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 8px 28px #4a8bb52b}
.controls{display:flex;flex-direction:column;gap:12px;margin:20px auto 0;max-width:460px}
button,.link{border:0;border-radius:999px;padding:14px 20px;background:#fff;color:#23618c;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 3px 12px #5489a52b;cursor:pointer}
button{background:#d8efff}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link:last-child{grid-column:1/-1}
.note{font-size:13px;color:#64849a;margin-top:12px}
</style>
</head>
<body>
<main>
<img class="invite" src="invitacion.png" alt="Invitación al baby shower de Andrew Eithan">
<div class="controls">
<button id="play" type="button">▶ Reproducir música</button>
<div class="links">
<a class="link" href="https://whocan.org/vote/baby-shower-de-andrew-eithan-bdn" target="_blank" rel="noopener">🐉 Confirmar asistencia</a>
<a class="link" href="https://baby-list-andrew-eithan-61e5c.web.app" target="_blank" rel="noopener">⭐ Ver Baby List</a>
<a class="link" href="https://www.google.com/maps?q=-11.9492827,-77.0570359&entry=gps" target="_blank" rel="noopener">☁️ Ver ubicación</a>
</div>
<p class="note">Toca el botón para escuchar la canción. Puedes pausar cuando quieras.</p>
<audio id="song" preload="none" src="musica.mp3"></audio>
</div>
</main>
<script>
const audio=document.getElementById('song'),btn=document.getElementById('play');
btn.addEventListener('click',async()=>{
 if(audio.paused){try{await audio.play();btn.textContent='❚❚ Pausar música'}catch(e){btn.textContent='No se pudo reproducir; vuelve a tocar'} }
 else{audio.pause();btn.textContent='▶ Reproducir música'}
});
audio.addEventListener('ended',()=>btn.textContent='▶ Reproducir música');
</script>
</body>
</html>
